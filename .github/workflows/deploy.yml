# .github/workflows/deploy.yml
name: Deploy static site to S3 + CloudFront

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      S3_BUCKET: portfolio-jaden
      CLOUDFRONT_DISTRIBUTION_ID: EJO8JZXNMBOQC
      AWS_REGION: us-east-2

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Sync "site/" folder to bucket ROOT; e.g. site/resume/Resume.pdf -> s3://bucket/resume/Resume.pdf
      - name: Sync site/ to S3 root
        run: |
          aws s3 sync site s3://$S3_BUCKET --delete --region $AWS_REGION

      - name: Invalidate CloudFront (index + resume)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/index.html" "/resume/*"
